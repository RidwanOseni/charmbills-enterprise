[package]
name = "subscription-engine"
description = "Charms Enterprise Payroll Engine"
version = "0.15.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
wasm-bridge = ["wasm-bindgen", "serde-wasm-bindgen"]
default = []

[dependencies]
charms-sdk = "15.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
sha2 = "0.10.9"

wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1.7"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"