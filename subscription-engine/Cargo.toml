[package]
name = "subscription-engine"
description = "A simple Charms app"
version = "0.12.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Feature for building the WASM bridge (JS bindings for backend)
wasm-bridge = ["wasm-bindgen", "serde-wasm-bindgen"]
# Default build (pure binary for prover) has no features
default = []

[dependencies]
charms-sdk = "0.12.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10.9"
ciborium = "0.2"
hex = "0.4"
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"